[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-bert-fraud"
version = "0.1.0"
description = "BERT representation learning for sequential credit-card fraud detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "accelerate>=1.0,<3",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "torch>=2.1",
    "tqdm>=4.66,<5",
    "transformers>=4.46,<6",
]

[project.scripts]
pretrain-transaction-bert = "transaction_bert.cli.pretrain:main"
train-fraud-classifier = "transaction_bert.cli.train_fraud:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
